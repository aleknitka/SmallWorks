[project]
name = "smallworks"
version = "0.1.0"
description = "Multi-model software engineering orchestration optimised for small/local LLMs"
readme = "README.md"
authors = [
    { name = "aleksander nitka", email = "aleknitka@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.28",
    "loguru>=0.7",
]

[project.scripts]
smallworks = "smallworks.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv_build]
module-root = "src"
module-name = "smallworks"
