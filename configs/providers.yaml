# Provider endpoint slots: base URL + env var holding the API key (spec §4).
# Keys are NEVER stored here — set them in the app (Tube → Providers) or in
# `.env` (`GITHUB_TOKEN`, `OPENAI_API_KEY`, …); `.env` is always gitignored.
# Ships with ONE local slot; add more with [+] on the settings page (any
# known vendor: ollama, vllm, litellm, github, openai). Omitted vendors fall
# back to built-in defaults until added. `api_key_env: ""` = no key is sent.
providers:
  ollama:
    base_url: http://localhost:11434/v1
    api_key_env: ""
    default_model: qwen2.5-coder-8b
