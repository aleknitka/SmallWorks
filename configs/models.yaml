# Logical model groups -> deployments (spec §4).
# Workers reference group names only, never provider IDs.
#
# Local-first: every group leads with installed Ollama models and falls back
# to OpenRouter (key in $OPENROUTER_API_KEY or .env; model id is yours to
# pick, e.g. "openai/gpt-4o-mini" or "anthropic/claude-3-5-sonnet").
# `class` marks each deployment; order = default preference.
models:
  # Local reasoning first (gpt-oss 20B); cloud fallback when you pick a model.
  strong_reasoning:
    - provider: ollama
      model: gpt-oss:latest
      class: self-hosted
    - provider: openrouter
      model: openrouter/fallback-reasoning
      class: frontier
  # Local planning (mistral-nemo 12B, 1M ctx); cloud fallback.
  engineering:
    - provider: ollama
      model: mistral-nemo:12b
      class: self-hosted
    - provider: openrouter
      model: openrouter/fallback-engineering
      class: frontier
  # Local execution (ornith); cloud fallback.
  # Note: clef-flash is completion-only (no /chat/completions) — not routable.
  coder_fast:
    - provider: ollama
      model: ornith:latest
      class: self-hosted
    - provider: openrouter
      model: openrouter/fallback-coder
      class: frontier
  # Local review (mistral-nemo 12B); cloud fallback breaks ties.
  reviewer:
    - provider: ollama
      model: mistral-nemo:12b
      class: self-hosted
    - provider: openrouter
      model: openrouter/fallback-reviewer
      class: frontier
