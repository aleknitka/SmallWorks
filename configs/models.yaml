# Logical model groups -> deployments (spec §4).
# Workers reference group names only, never provider IDs.
#
# Two shapes per group:
#   plain list            -> `fallback`: try in order, first success wins.
#   strategy: pool        -> same-priority pool: calls spread across every
#     healthy deployment (round-robin); failures cool down for
#     `pool_cooldown_s`, then rejoin. All-down behaves like fallback.
# Add same-level models by appending to `deployments` — no priority edits.
# Local-first: Ollama leads, OpenRouter/HuggingFace join pools or rescue.
# HF_TOKEN / OPENROUTER_API_KEY live in $env or `.env`, never here.
models:
  strong_reasoning:
    strategy: pool
    pool_cooldown_s: 60.0
    deployments:
      - provider: ollama
        model: gpt-oss:latest
        class: self-hosted
        params: {temperature: 0, num_predict: 4096}
      - provider: ollama
        model: mistral-nemo:12b
        class: self-hosted
        params: {temperature: 0, num_predict: 4096}
      - provider: openrouter
        model: openrouter/fallback-reasoning
        class: frontier
  engineering:
    strategy: pool
    pool_cooldown_s: 60.0
    deployments:
      - provider: ollama
        model: mistral-nemo:12b
        class: self-hosted
        params: {temperature: 0, num_predict: 4096}
      - provider: ollama
        model: ornith:latest
        class: self-hosted
        params: {temperature: 0, num_predict: 4096}
      - provider: huggingface
        model: YOUR-HF-MODEL-HERE
        class: frontier
      - provider: openrouter
        model: openrouter/fallback-engineering
        class: frontier
  coder_fast:
    strategy: pool
    pool_cooldown_s: 60.0
    deployments:
      - provider: ollama
        model: ornith:latest
        class: self-hosted
        params: {temperature: 0, num_predict: 8192, num_ctx: 16384}
      - provider: ollama
        model: qwen3.5:latest
        class: self-hosted
        params: {temperature: 0, num_predict: 8192, num_ctx: 16384}
      - provider: ollama
        model: mistral-nemo:12b
        class: self-hosted
        params: {temperature: 0, num_predict: 4096}
      - provider: openrouter
        model: openrouter/fallback-coder
        class: frontier
  reviewer:
    strategy: pool
    pool_cooldown_s: 60.0
    deployments:
      - provider: ollama
        model: mistral-nemo:12b
        class: self-hosted
        params: {temperature: 0, num_predict: 4096}
      - provider: openrouter
        model: openrouter/fallback-reviewer
        class: frontier
