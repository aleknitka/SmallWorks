<!doctype html>
<html lang="en" data-scheme="dark">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmallWorks // Tube Settings</title>
<style>
  :root, :root[data-scheme="dark"] {
    --bg: #0a0a0a; --bg2: #0d120f; --ph: #00ff7a; --ph-dim: #3e6a57;
    --amber: #ffb000; --red: #ff2b2b; --ink: #c6ffdf;
    --line: rgba(0,255,122,.18); --glow: 0 0 14px rgba(0,255,122,.08);
    --ts: 0 0 6px rgba(0,255,122,.35);
    --scan: rgba(0,255,122,.045); --vig: rgba(0,0,0,.55);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  :root[data-scheme="light"] {
    --bg: #e8e4d8; --bg2: #dfdacd; --ph: #0b5c36; --ph-dim: #7a8a7e;
    --amber: #8a5a00; --red: #a31212; --ink: #0a1f14;
    --line: rgba(11,92,54,.28); --glow: 0 0 0 rgba(0,0,0,0);
    --ts: none;
    --scan: rgba(11,92,54,.03); --vig: rgba(90,80,50,.25);
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--mono); font-size: 13px; line-height: 1.45;
    letter-spacing: .2px; background: var(--bg); color: var(--ph);
    margin: 0; padding: 12px; display: flex; flex-direction: column; gap: 10px;
    min-height: 100vh; text-shadow: var(--ts);
  }
  /* Same tube as the console: scanlines + grille + bloom + vignette + sweep + flicker */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background:
      repeating-linear-gradient(to right, rgba(0,0,0,.11) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(to bottom, var(--scan) 0 1px, transparent 1px 4px),
      radial-gradient(120% 85% at 50% 0%, var(--scan), transparent 65%),
      radial-gradient(120% 110% at 50% 100%, var(--vig), transparent 60%);
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 51;
    background: linear-gradient(transparent 0%, var(--scan) 48%, rgba(255,255,255,.05) 50%, var(--scan) 52%, transparent 100%);
    background-size: 100% 220px; background-repeat: repeat-y;
    animation: sweep 9s linear infinite; opacity: .5;
  }
  @keyframes sweep { from { background-position: 0 -220px; } to { background-position: 0 220px; } }
  @keyframes flick { 0%,100% { opacity: 1; } 97% { opacity: 1; } 98% { opacity: .86; } 99% { opacity: 1; } }
  main { animation: flick 7s steps(1) infinite; }
  html[data-fx-scan="off"] body::after { display: none; }
  html[data-fx-sweep="off"] body::before { display: none; }
  html[data-fx-flick="off"] main { animation: none; }
  html[data-fx-glow="off"] body { text-shadow: none; }
  h2 { font-size: 13px; letter-spacing: 2px; margin: 0 0 8px; text-transform: uppercase; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  header, section {
    border: 1px solid var(--line); background: var(--bg2);
    padding: 10px 12px; border-radius: 8px;
  }
  header { display: flex; gap: 16px; align-items: center; }
  header .wordmark { color: var(--ink); font-weight: 700; }
  header nav { flex: 1; display: flex; gap: 8px; }
  header nav a, header button { font: inherit; color: var(--ph); text-decoration: none; background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  header nav a:hover, header button:hover { box-shadow: var(--glow); border-color: var(--ph); }
  header nav a[aria-current="page"] { color: var(--ink); border-color: var(--ph); }
  :focus-visible { outline: 2px solid var(--ph); outline-offset: 2px; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; align-items: start; }
  .note { color: var(--ph-dim); font-size: 11px; margin: 0 0 8px; }
  .note code { color: var(--ph); }
  .prov { border-bottom: 1px dotted var(--line); padding: 8px 0; min-width: 0; }
  .prov:last-child { border-bottom: none; }
  .prov .top { display: flex; align-items: center; gap: 10px; }
  .prov .nm { flex: 1; }
  .prov .key { font-size: 11px; color: var(--ph-dim); white-space: nowrap; }
  .prov .key.set { color: var(--ph); }
  .prov label.plab { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 6px; align-items: center; margin-top: 6px; font-size: 11px; color: var(--ph-dim); }
  .prov input { font: inherit; font-size: 12px; color: var(--ph); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; width: 100%; min-width: 0; }
  .prov input::placeholder { color: var(--ph-dim); }
  .prov .save { margin-top: 8px; font: inherit; color: var(--ph); background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 4px 12px; cursor: pointer; }
  .prov .save:hover { box-shadow: var(--glow); border-color: var(--ph); }
  .prov select { font: inherit; font-size: 12px; color: var(--ph); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; width: 100%; min-width: 0; }
  .prov .addslot { border: 1px dashed var(--line); border-radius: 4px; padding: 8px; margin-top: 8px; }
  .prov .assign { border-top: 1px dotted var(--line); margin-top: 8px; padding-top: 8px; }
  .prov .atitle { font-size: 11px; letter-spacing: 2px; color: var(--ph-dim); margin-bottom: 2px; }
  .route { border-bottom: 1px dotted var(--line); padding: 6px 0; font-size: 12px; overflow-wrap: anywhere; }
  .fxrow { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px dotted var(--line); }
  .fxrow:last-child { border-bottom: none; }
  .fxrow .nm { flex: 1; min-width: 0; }
  .route:last-child { border-bottom: none; }
  .route .grp { color: var(--ph-dim); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
    body::before { display: none; }
  }
</style>
<header>
  <span class="wordmark">SMALLWORKS // MU-TH-UR 6000</span>
  <nav><a href="/">CONSOLE</a><a href="/tube" aria-current="page">TUBE</a></nav>
  <button id="schemeBtn" type="button" aria-label="Toggle colour scheme">SCHEME: DARK</button>
</header>
<main>
  <section aria-label="Providers"><h2>Providers</h2>
    <p class="note">One slot ships (local). [+] adds a vendor; each model assigns to roles. Keys save to <code>.env</code> (gitignored), never to YAML.</p>
    <div id="provList"></div>
  </section>
  <section aria-label="Routing"><h2>Routing</h2><div id="routeList"></div></section>
  <section aria-label="Tube effects"><h2>Tube effects</h2><div id="fxList"></div></section>
  <section aria-label="Display"><h2>Display</h2><div id="schemeList"></div></section>
</main>
<footer>BUILDING BETTER WORLDS</footer>
<script>
const $ = id => document.getElementById(id);
// Only effects that actually ship in the CSS overlay above. Adding a new CRT
// layer? Add its style rule, its data-fx gate, and one row here — nothing else.
const FX = [
  ["scan", "SCANLINES + GRILLE", "body::after overlay: 1px scanlines + vertical aperture grille + bloom + vignette", true],
  ["sweep", "REFRESH SWEEP", "body::before band drifting down the tube, 9s loop", true],
  ["flick", "PHOSPHOR FLICKER", "7s brightness dip across the shell", true],
  ["glow", "TEXT BLOOM", "text-shadow phosphor glow on body copy", true],
  ["boot", "BOOT SEQUENCE", "staged SYS.CHECK lines on console load", true],
];
function fxGet(k, fb) { try { const v = localStorage.getItem("sw-fx-" + k); return v === null ? fb : v === "on"; } catch { return fb; } }
function fxApply(k, on) {
  document.documentElement.dataset["fx" + k[0].toUpperCase() + k.slice(1)] = on ? "on" : "off";
  try { localStorage.setItem("sw-fx-" + k, on ? "on" : "off"); } catch {}
}
function renderFx() {
  const box = $("fxList"); box.innerHTML = "";
  for (const [k, label, hint, fb] of FX) {
    const div = document.createElement("div"); div.className = "fxrow";
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = label;
    const h = document.createElement("span"); h.className = "hint"; h.textContent = hint; nm.appendChild(h);
    const st = document.createElement("span"); st.className = "st";
    const btn = document.createElement("button"); btn.type = "button"; btn.setAttribute("aria-label", "Toggle " + label);
    const paint = () => {
      const on = fxGet(k, fb);
      st.textContent = on ? "ON" : "OFF"; st.classList.toggle("on", on);
      btn.textContent = on ? "[X]" : "[ ]"; btn.setAttribute("aria-pressed", String(on));
    };
    btn.onclick = () => { fxApply(k, !fxGet(k, fb)); paint(); };
    div.append(nm, st, btn); box.appendChild(div); paint();
  }
}
const ROLES = ["orchestrator", "engineer", "developer", "tester", "reviewer"];
let PROVIDERS = [];
async function loadProviders() {
  const box = $("provList"); box.innerHTML = "";
  let data; try { data = await (await fetch("/api/providers")).json(); } catch { box.textContent = "OFFLINE"; return; }
  PROVIDERS = data.providers;
  const configured = PROVIDERS.filter(p => p.configured);
  const pending = PROVIDERS.filter(p => !p.configured);
  for (const p of configured) box.appendChild(providerCard(p, false));
  // One [+] slot: pick an unconfigured vendor to add a new provider form.
  if (pending.length) {
    const add = document.createElement("div"); add.className = "prov addslot";
    const lab = document.createElement("label"); lab.className = "plab"; lab.textContent = "ADD";
    const sel = document.createElement("select");
    for (const p of pending) {
      const opt = document.createElement("option"); opt.value = p.name; opt.textContent = p.name.toUpperCase();
      sel.appendChild(opt);
    }
    lab.appendChild(sel); add.appendChild(lab);
    const btn = document.createElement("button"); btn.className = "save"; btn.type = "button"; btn.textContent = "[+]";
    btn.setAttribute("aria-label", "Add provider slot");
    btn.onclick = () => {
      const seeded = PROVIDERS.find(p => p.name === sel.value);
      box.insertBefore(providerCard(seeded, true), add);
      btn.disabled = true;
    };
    add.appendChild(btn); box.appendChild(add);
  }
}
function providerCard(p, isNew) {
  const div = document.createElement("div"); div.className = "prov";
  const top = document.createElement("div"); top.className = "top";
  const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = p.name.toUpperCase() + (isNew ? " (NEW)" : "");
  const key = document.createElement("span"); key.className = "key" + (p.key_set ? " set" : "");
  key.textContent = p.key_set ? `KEY:${p.key_source}` : (p.needs_key ? "KEY:MISSING" : "KEY:--");
  top.append(nm, key); div.appendChild(top);
  const inputs = {};
  const mkField = (f, label, val, ph, type) => {
    const lab = document.createElement("label"); lab.className = "plab"; lab.textContent = label;
    const inp = document.createElement("input");
    inp.value = val; inp.placeholder = ph; if (type) inp.type = type;
    inputs[f] = inp; lab.appendChild(inp); div.appendChild(lab);
  };
  mkField("base_url", "ENDPOINT", p.effective_base_url, "base URL for chat/completions");
  mkField("api_key", "API KEY", "", p.api_key_env ? `new key for ${p.api_key_env} (blank = keep)` : "no key needed (local)", "password");
  if (!p.api_key_env && !p.needs_key) inputs.api_key.disabled = true;
  mkField("default_model", "MODEL", p.default_model, "default model id");
  const save = document.createElement("button"); save.className = "save"; save.type = "button"; save.textContent = "SAVE";
  save.onclick = async () => {
    save.textContent = "SAVING...";
    const body = { providers: { [p.name]: { base_url: inputs.base_url.value } } };
    if (inputs.api_key.value) body.providers[p.name].api_key = inputs.api_key.value;
    if (inputs.default_model.value !== p.default_model) body.providers[p.name].default_model = inputs.default_model.value;
    const res = await fetch("/api/providers", { method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
    save.textContent = res.ok ? "SEALED" : "FAILED";
    setTimeout(() => { save.textContent = "SAVE"; }, 1500);
    if (res.ok) { loadProviders(); loadRouting(); }
  };
  div.appendChild(save);
  // Per-model role assignment: model id + role + position, appended to the
  // role's fallback chain (or replacing it with ONLY).
  const asg = document.createElement("div"); asg.className = "assign";
  const t = document.createElement("div"); t.className = "atitle"; t.textContent = "ASSIGN MODEL TO ROLE"; asg.appendChild(t);
  const mRow = document.createElement("label"); mRow.className = "plab"; mRow.textContent = "MODEL";
  const mInp = document.createElement("input"); mInp.placeholder = p.default_model || "model id, e.g. openai/gpt-4o-mini";
  mRow.appendChild(mInp); asg.appendChild(mRow);
  const rRow = document.createElement("label"); rRow.className = "plab"; rRow.textContent = "ROLE";
  const rSel = document.createElement("select");
  for (const r of ROLES) { const o = document.createElement("option"); o.value = r; o.textContent = r; rSel.appendChild(o); }
  rRow.appendChild(rSel); asg.appendChild(rRow);
  const pRow = document.createElement("label"); pRow.className = "plab"; pRow.textContent = "AS";
  const pSel = document.createElement("select");
  for (const [v, l] of [["append", "EXTRA"], ["prepend", "FIRST"], ["only", "ONLY"]]) {
    const o = document.createElement("option"); o.value = v; o.textContent = l; pSel.appendChild(o);
  }
  pRow.appendChild(pSel); asg.appendChild(pRow);
  const go = document.createElement("button"); go.className = "save"; go.type = "button"; go.textContent = "ASSIGN";
  go.onclick = async () => {
    if (!mInp.value.trim()) { go.textContent = "NEED MODEL"; setTimeout(() => { go.textContent = "ASSIGN"; }, 1500); return; }
    go.textContent = "SAVING...";
    const res = await fetch("/api/models/assign", { method: "PUT", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ role: rSel.value, provider: p.name, model: mInp.value.trim(), position: pSel.value }) });
    go.textContent = res.ok ? "SEALED" : "FAILED";
    setTimeout(() => { go.textContent = "ASSIGN"; }, 1500);
    if (res.ok) { mInp.value = ""; loadRouting(); }
  };
  asg.appendChild(go); div.appendChild(asg);
  return div;
}
async function loadRouting() {
  const box = $("routeList"); box.innerHTML = "";
  let data; try { data = await (await fetch("/api/models/groups")).json(); } catch { box.textContent = "OFFLINE"; return; }
  for (const [role, group] of Object.entries(data.roles)) {
    const div = document.createElement("div"); div.className = "route";
    const chain = (data.groups[group] || []).map(d => `${d.provider}/${d.model}`).join(" -> ");
    const r = document.createElement("div"); r.textContent = `${role} -> ${group}`;
    const g = document.createElement("div"); g.className = "grp"; g.textContent = chain;
    div.append(r, g); box.appendChild(div);
  }
}
function setScheme(mode) {
  document.documentElement.dataset.scheme = mode;
  try { localStorage.setItem("sw-scheme", mode); } catch {}
  $("schemeBtn").textContent = `SCHEME: ${mode.toUpperCase()}`;
  paintScheme();
}
function paintScheme() {
  const box = $("schemeList"); box.innerHTML = "";
  const dark = document.documentElement.dataset.scheme !== "light";
  for (const [mode, hint] of [["dark", "Nostromo bridge: phosphor on hull black"], ["light", "Weyland day-shift: dark ink on deck paper"]]) {
    const div = document.createElement("div"); div.className = "fxrow";
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = "COLOUR " + mode.toUpperCase();
    const h = document.createElement("span"); h.className = "hint"; h.textContent = hint; nm.appendChild(h);
    const st = document.createElement("span"); st.className = "st";
    const active = (mode === "dark") === dark;
    st.textContent = active ? "ON" : "OFF"; st.classList.toggle("on", active);
    const btn = document.createElement("button"); btn.type = "button";
    btn.textContent = active ? "[X]" : "[ ]"; btn.setAttribute("aria-pressed", String(active));
    btn.setAttribute("aria-label", "Use " + mode + " scheme");
    btn.onclick = () => setScheme(mode);
    div.append(nm, st, btn); box.appendChild(div);
  }
}
$("schemeBtn").onclick = () => setScheme(document.documentElement.dataset.scheme === "dark" ? "light" : "dark");
try { const s = localStorage.getItem("sw-scheme"); if (s === "light" || s === "dark") setScheme(s); } catch {}
try { const q = new URLSearchParams(location.search).get("scheme"); if (q === "light" || q === "dark") setScheme(q); } catch {}
for (const [k, , , fb] of FX) fxApply(k, fxGet(k, fb));
renderFx(); paintScheme(); loadProviders(); loadRouting();
</script>
</html>
