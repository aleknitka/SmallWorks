<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmallWorks</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 2em auto; max-width: 720px; }
  #runs li { margin: .25em 0; }
  #chat { border: 1px solid #ccc; padding: 1em; margin-top: 1em; min-height: 8em; }
  .u { color: #1a5fb4; } .o { color: #1a7a2e; }
  form { display: flex; gap: .5em; margin-top: 1em; }
  input { flex: 1; padding: .5em; }
  #controls { display: flex; gap: .5em; margin-top: 1em; flex-wrap: wrap; }
  #controls button { padding: .4em .8em; }
</style>
<h1>SmallWorks</h1>
<h2>Runs</h2>
<ul id="runs"></ul>
<div id="controls">
  <button data-a="pause">Pause</button>
  <button data-a="retry">Retry</button>
  <button data-a="escalate">Escalate</button>
  <button data-a="approve">Approve gate</button>
  <button data-a="reject">Reject gate</button>
</div>
<h2>Orchestrator chat</h2>
<div id="chat"></div>
<form id="f"><input id="msg" placeholder="Message the orchestrator…" autocomplete="off"><button>Send</button></form>
<script>
const runId = "demo";
async function runs() {
  const r = await fetch("/api/runs").then(r => r.json());
  document.getElementById("runs").innerHTML =
    r.map(x => `<li><b>${x.run_id}</b> ${x.task_id} · ${x.status} · ${x.worker} · ${x.model}</li>`).join("");
}
async function chat() {
  const t = await fetch(`/api/runs/${runId}/chat`).then(r => r.json());
  document.getElementById("chat").innerHTML =
    t.messages.map(m => `<p class="${m.role[0]}"><b>${m.role}:</b> ${m.content}</p>`).join("") || "<p><i>No messages yet.</i></p>";
}
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const el = document.getElementById("msg");
  if (!el.value.trim()) return;
  await fetch(`/api/runs/${runId}/chat`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({content: el.value})});
  el.value = "";
  chat();
};
document.querySelectorAll("#controls button").forEach(b => b.onclick = async () => {
  await fetch(`/api/runs/${runId}/control`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({action: b.dataset.a})});
  runs();
});
runs(); chat(); setInterval(() => { runs(); chat(); }, 5000);
</script>
</html>
